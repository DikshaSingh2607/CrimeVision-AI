version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crimevision-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: forensic_password_secure
      POSTGRES_DB: crimevision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crimevision-app
    restart: always
    environment:
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: postgresql://postgres:forensic_password_secure@db:5432/crimevision_db
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:
